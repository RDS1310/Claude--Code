name: Collecte news quotidienne

# Chaque matin (~07:45 Paris l'été, ~06:45 l'hiver ; GitHub peut retarder de quelques minutes).
# Gratuit, sans IA : écrit veille_data/raw/AAAA-MM-JJ.json, lu par la routine Claude hebdomadaire.
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte-news
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python3 collecte_news_quotidienne.py --jours 2
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille_data/raw
          git diff --cached --quiet && exit 0
          git commit -m "Collecte news du $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
